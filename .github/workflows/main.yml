name: Update Berita KabarNusa

on:
schedule:
- cron: "0 */6 * * *"
workflow_dispatch:

permissions:
contents: read

jobs:
update-news:
runs-on: ubuntu-latest
steps:
- name: Ambil kode dari GitHub
uses: actions/checkout@v4

  - name: Siapkan Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Instal dependensi
    run: npm install

  - name: Jalankan pembaruan berita
    run: node index.js
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
